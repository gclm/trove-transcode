name: trove-scheduled

# 定时采集：collect job 只做「热点 → 一次 batch 建任务 → 切片」，下载/转码/上传交给 matrix。
# 分片并行：每个分片一个 runner，片内串行；失败片可单独 re-run。
# 6 个上传 bot：Worker 的 BOTS 配置数组顺序决定槽位；仓库变量 COLLECT_BOT_SLOTS=0,1,2,3,4,5、COLLECT_PARALLEL=6。
on:
  schedule:
    - cron: "30 18 * * *"   # UTC 18:30 = 北京 02:30
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮采集条数上限"
        required: false
        default: "72"

permissions:
  contents: read

concurrency:
  group: trove-scheduled
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Plan shards
        id: plan
        env:
          API_BASE: ${{ secrets.TROVE_API_BASE }}
          TROVE_API_KEY: ${{ secrets.TROVE_API_KEY }}
          COLLECT_LIMIT: ${{ github.event.inputs.limit || '72' }}
          COLLECT_BOT_SLOTS: ${{ vars.COLLECT_BOT_SLOTS || '0' }}
          COLLECT_SUMMARY_PATH: collect-summary.json
        run: |
          python workers/scheduled/collect91/job.py > shards.json
          cat shards.json
          echo "shards=$(cat shards.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c 'import json; print(sum(len(s["items"]) for s in json.load(open("shards.json"))))')" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("collect-summary.json"))
          print("### collect")
          print(f"- fresh: {d['fresh']}")
          print(f"- created: {d['created']}")
          print(f"- skipped: {d['skipped']}")
          print(f"- items: {d['items']}")
          PY

  pipeline:
    needs: collect
    if: needs.collect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # 仓库变量 COLLECT_PARALLEL：当前默认 2；6 个 bot 配好后设为 6。
      max-parallel: ${{ fromJson(vars.COLLECT_PARALLEL || '2') }}
      matrix:
        shard: ${{ fromJson(needs.collect.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - name: Run shard
        env:
          SHARD: ${{ toJson(matrix.shard) }}
          API_BASE: ${{ secrets.TROVE_API_BASE }}
          TROVE_API_KEY: ${{ secrets.TROVE_API_KEY }}
        run: |
          set -o pipefail
          python workers/scheduled/collect91/pipeline.py | tee pipeline.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("pipeline.json"))
          print("### shard pipeline")
          print(f"- ok: {d.get('ok', 0)}")
          print(f"- failed: {len(d.get('failed', []))}")
          PY
