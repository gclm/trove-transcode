name: trove-scheduled

# 定时采集：collect job 只做「热点 → 去重 → 建任务 → 切片」，下载/转码/上传交给 matrix。
# 分片并行：每个分片一个 runner，片内串行；失败片可单独 re-run。
on:
  schedule:
    - cron: "30 18 * * *"   # UTC 18:30 = 北京 02:30
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮采集条数上限"
        required: false
        default: "72"

permissions:
  contents: read

concurrency:
  group: trove-scheduled
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Plan shards
        id: plan
        env:
          API_BASE: ${{ secrets.TROVE_API_BASE }}
          TROVE_API_KEY: ${{ secrets.TROVE_API_KEY }}
          PORN91_COOKIE: ${{ secrets.PORN91_COOKIE }}
          COLLECT_LIMIT: ${{ github.event.inputs.limit || '72' }}
        run: |
          python workers/scheduled/collect91/job.py > shards.json
          cat shards.json
          echo "shards=$(cat shards.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c 'import json,sys; print(sum(len(s) for s in json.load(open("shards.json"))))')" >> "$GITHUB_OUTPUT"

  pipeline:
    needs: collect
    if: needs.collect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJson(needs.collect.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - name: Run shard
        env:
          SHARD: ${{ toJson(matrix.shard) }}
          API_BASE: ${{ secrets.TROVE_API_BASE }}
          TROVE_API_KEY: ${{ secrets.TROVE_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PORN91_COOKIE: ${{ secrets.PORN91_COOKIE }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
        run: python workers/scheduled/collect91/pipeline.py
