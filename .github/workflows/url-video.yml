name: Trove URL Video

on:
  repository_dispatch:
    types: [trove-url]

permissions:
  contents: read

concurrency:
  group: trove-url-${{ github.event.client_payload.sourceId }}
  cancel-in-progress: false

jobs:
  url-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -n 1
      - name: Download resolved link and transcode
        env:
          SOURCE_ID: ${{ github.event.client_payload.sourceId }}
          API_BASE: ${{ secrets.TROVE_API_BASE }}
          TROVE_API_KEY: ${{ secrets.TROVE_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: node scripts/url-video.mjs
