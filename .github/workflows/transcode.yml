name: Trove HLS Transcode

on:
  repository_dispatch:
    types: [trove-transcode]

permissions:
  contents: read

concurrency:
  group: trove-transcode-${{ github.event.client_payload.sourceId }}
  cancel-in-progress: false

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify ffmpeg
        run: ffmpeg -version | head -n 2

      - name: Transcode to HLS and upload to Telegram
        env:
          SOURCE_ID: ${{ github.event.client_payload.sourceId }}
          SOURCE_GET_URL: ${{ github.event.client_payload.sourceGetUrl }}
          SOURCE_NAME: ${{ github.event.client_payload.sourceName }}
          API_BASE: ${{ github.event.client_payload.apiBase }}
          TROVE_API_KEY: ${{ secrets.TROVE_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: node scripts/hls-transcode.mjs
